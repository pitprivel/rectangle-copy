<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rectangle Copy promo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body { background: linear-gradient(140deg, #1d4ed8 0%, #2563eb 50%, #4f46e5 100%); color: #fff;
      font: 15px/1.3 "Segoe UI", system-ui, sans-serif; position: relative; }
    .text { position: absolute; left: 26px; top: 30px; width: 214px; }
    .text img { width: 56px; height: 56px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
    h1 { margin: 14px 0 8px; font-size: 27px; letter-spacing: -0.3px; }
    p { margin: 0; font-size: 16px; color: #dbeafe; }
    .grid { position: absolute; right: 26px; top: 46px; display: grid; grid-template-columns: repeat(3, 46px); gap: 7px; }
    .grid span { height: 22px; border-radius: 4px; background: rgba(255,255,255,.28); }
    .grid span:nth-child(3n + 2) { background: #fff; }
    .sel { position: absolute; right: 74px; top: 40px; width: 58px; height: 197px; border: 3px solid #facc15; border-radius: 6px; }
    .cursor { position: absolute; right: 52px; top: 222px; }
  </style>
</head>
<body>
  <div class="text">
    <img src="/dist-test/icons/icon128.png" alt="">
    <h1>Rectangle Copy</h1>
    <p id="tag"></p>
  </div>
  <div class="grid">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>
  <div class="sel"></div>
  <svg class="cursor" viewBox="0 0 16 22" width="22" height="30"><path d="M1 1v17l4.5-4.2 3 6.7 3-1.3-3-6.6H15z" fill="#111" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg>
  <script>
    const lang = new URLSearchParams(location.search).get('lang') || 'en';
    window.sceneReady = fetch(`../listing/${lang}.json`).then((r) => r.json()).then((L) => {
      document.getElementById('tag').textContent = L.promo;
    });
  </script>
</body>
</html>
